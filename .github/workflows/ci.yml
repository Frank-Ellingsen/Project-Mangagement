name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q AI_Controller

      - name: Build analytical and transactional databases
        run: |
          python AI_Controller/build_duckdb.py
          python AI_Controller/build_sqlite.py

      - name: Verify data integrity
        run: python AI_Controller/verify_dataset.py

      - name: Run reporting and audit scripts
        run: |
          python AI_Controller/tufte_cli_dashboard.py
          python AI_Controller/excel_report_agent.py
          python AI_Controller/build_pbi_project.py
          python AI_Controller/run_agents.py
          python AI_Controller/export_executive_report.py
